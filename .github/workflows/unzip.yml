name: Unzip WakeMate source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source
        run: |
          unzip -o WakeMate-GitHub-upload.zip -d . || [ $? -eq 1 ]
          rm -f WakeMate-GitHub-upload.zip
          rm -f .github/workflows/build.yml
      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unzip WakeMate source" || true
          git push origin HEAD:main
